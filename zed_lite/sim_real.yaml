# The REAL lab's ZED settings for the virtual ZED in the sim (measured live on the lab PC, 2026-10-16, zed1/zed2/zed3 wrappers):
# camera zed2i, grab HD720 @ 30 fps, published at half size (640x360), depth NEURAL_LIGHT, depth stabilization 30, min/max depth 0.3/10 m.
# What cannot be copied: positional tracking (the sim stream has no IMU) and the camera model (the Isaac extension only has ZED_X: ~same 110 deg HFOV).
# Use with franka_mpc/run_grasp.sh REAL=1. The Isaac ZED X has no HD720 (only HD1200/HD1080/SVGA): it streams HD1080 and the wrapper's downscale 3 gives
# exactly the real 640x360. DEVIATION: the depth network sees a 1080p grab here, the real one a 720p grab.
/**:
  ros__parameters:
    pos_tracking:
      pos_tracking_enabled: false
    sensors:
      publish_imu: false
      publish_imu_raw: false
    general:
      pub_resolution: 'CUSTOM'
      pub_downscale_factor: 3.0
    depth:
      depth_mode: 'NEURAL_LIGHT'
      depth_stabilization: 30
      min_depth: 0.3
      max_depth: 10.0
