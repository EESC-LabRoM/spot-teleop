##
## Robot-path default MPC override (real FR3 via vm_real.sh; ALSO the sim default shape).
## Tracking tuning, measured on the steady-hand bag / drill runs:
##   - null_space_weight 100 (base default 10): stops the elbow drifting through the
##     arm's spare joint (j1/j7 swung up to 20 deg with the tool standing still).
##   - mppi sample_mode MEAN (cuRobo default BEST): steadier commands, less jitter.
##   - primitive_collision activation_distance 0.05 (was 0.025): fingers grazed the
##     box in 4 of 8 runs; they now stay 28-36 mm clear.
##   - pose_cfg weight[0] (rotation) 200 (cuRobo default 60): the tool keeps up with
##     hand rotation instead of lagging it.
##

model:
  horizon: 24
  state_filter_cfg:
    filter_coeff:
      position: 0.2    # Increased from 0.1 for more smoothing
      velocity: 0.3    # Increased from 0.1 for more damping
      acceleration: 0.1  # Added acceleration smoothing

cost:
  pose_cfg:
    weight: [200.0, 300.0, 20, 20]  # rotation 200 (cuRobo default 60): tool keeps up with hand rotation

  # Reduce collision weight slightly to avoid aggressive repulsion
  primitive_collision_cfg:
    weight: 50000.0    # Reduced from 100000.0
    activation_distance: 0.04  # staged 4 cm candidate; offline validation required before use

  # Increase smoothness weights
  bound_cfg:
    smooth_weight: [0.0, 100.0, 50.0, 0.0]  # Increased acc and jerk smoothing
    null_space_weight: [100.0]  # posture cost toward cspace.retract_config (base default 10)

mppi:
  step_size_mean: 0.7      # Reduced from 0.9 for smoother updates
  step_size_cov: 0.05      # Increased from 0.01 for more exploration
  sample_mode: MEAN        # Steadier commands than the cuRobo default BEST
  gamma: 0.95              # Reduced from 0.98 for less aggressive
  n_iters: 5               # Reduced iterations for less jitter
  num_particles: 400       # Reduced from 400 to lower GPU load on RTX A2000
